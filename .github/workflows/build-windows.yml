name: build-windows

# 在 GitHub 云端打包 Windows 版（含直播录制改造）。
#
# 原理：runner 上先取本仓库（改造 kit），再用 packaging/build_windows.ps1
# 下载上游源码、叠加改造、编译、压包。所以本仓库只需要放 kit 本身，
# 不需要把上游 500 多个文件一起提交。
#
# 用法：
#   1. 把整个 kit 推到 GitHub（私有仓库也行）；
#   2. 打开 Actions → build-windows → Run workflow；
#   3. 跑完后在本次运行的 Artifacts 里下载 zip。
#
# 也可以推 v* 标签触发，会自动建 Release 并附上 zip。
#
# ============================================================================
# 重要：下面所有 shell: powershell 的 run: 脚本体必须保持纯 ASCII。
#
# 原因：GitHub Actions 把 run: 的内容写成临时 .ps1 时**不加 UTF-8 BOM**，
# 而 Windows PowerShell 5.1 在没有 BOM 时会按系统 ANSI 码页读取脚本。中文被
# 误读后会破坏字符串解析，直接报出「表达式或语句中包含意外的标记」这类语法错误，
# 步骤会在几秒内失败 —— 看起来像脚本写错了，其实是编码问题。
#
# 这个坑是实测踩出来的：本地用 -File 跑同一段脚本是好的，因为测试时给文件加了
# BOM；而 runner 不加，所以只在云端复现。
#
# 所以：脚本体里的提示信息一律用英文。step 的 name: 和 inputs 的 description:
# 可以放心用中文（那是 YAML 值，由 runner 的 Node 进程按 UTF-8 解析，不经 PowerShell）。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter 版本（默认与上游 CI 一致；项目 .fvmrc 为 3.38.3）'
        required: false
        default: '3.38.x'
      upstream_tag:
        description: '上游 dart_simple_live tag'
        required: false
        default: 'v1.11.4'
      build_msix:
        description: '额外构建 msix 安装包（会先安装 flutter_distributor）'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

# 同一 ref 只保留最新一次运行，避免重复排队
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows 打包
    runs-on: windows-latest
    # 首次构建要下载 Flutter 引擎、编译 dart_quickjs 的原生代码，再跑 Windows 构建
    timeout-minutes: 90
    # 只有发布 Release 需要写权限，收在 job 级而不是工作流级
    permissions:
      contents: write

    steps:
      - name: 取本仓库（改造 kit）
        uses: actions/checkout@v4

      # 先自检 kit 是否完整。.gitignore 里一个不带前导斜杠的 src/ 规则就会把
      # simple_live_core/lib/src/ 整个排除掉，导致后面报出"找不到改造 kit 目录"
      # 这种完全不指向真实原因的错误。这里提前拦住并说明原因。
      #
      # 用 $root 拼绝对路径而不是直接 Test-Path 相对路径：后者依赖当前工作目录，
      # 万一 CWD 不是仓库根目录，就会误报"文件缺失"，把真正的编码问题掩盖成
      # 另一个看起来很像的问题。日志里会打印 $root，便于核对。
      - name: 校验 kit 完整性
        shell: powershell
        run: |
          $root = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          Write-Host "Checking kit under: $root"
          $need = @(
            'simple_live_core\lib\src\recorder\live_recorder.dart',
            'simple_live_core\lib\src\recorder\recorder_options.dart',
            'simple_live_core\lib\src\recorder\recorder.dart',
            'simple_live_app\lib\modules\live_room\recorder\room_recorder.dart',
            'simple_live_app\lib\modules\live_room\recorder\recorder_button.dart'
          )
          $missing = @($need | Where-Object { -not (Test-Path -LiteralPath (Join-Path $root $_)) })
          if ($missing.Count -gt 0) {
            Write-Host "Missing files:" -ForegroundColor Red
            $missing | ForEach-Object { Write-Host "  $_" -ForegroundColor Red }
            Write-Host ""
            Write-Host "Kit is incomplete. Most likely cause: .gitignore has an" -ForegroundColor Red
            Write-Host "unanchored 'src/' rule, which matches src/ at ANY depth and" -ForegroundColor Red
            Write-Host "excludes all of simple_live_core/lib/src/ . It must be '/src/' ." -ForegroundColor Red
            Write-Host "Check locally with:  git ls-files | findstr recorder   (expect 5 lines)" -ForegroundColor Red
            exit 1
          }
          Write-Host "Kit check passed (5 added files present)." -ForegroundColor Green

      - name: 准备 Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与上游 CI 保持一致（上游用 3.38.x，即 3.38.10 / Dart 3.10.9）。
          # 刻意不开 pub-cache：simple_live_core 的 dart_quickjs 是没有锁 ref 的
          # git 依赖，缓存住 git checkout 会让"首次构建"和"缓存命中"拿到不同版本。
          flutter-version: ${{ inputs.flutter_version || '3.38.x' }}
          channel: stable
          cache: true

      - name: 安装 flutter_distributor（仅 msix 需要）
        if: inputs.build_msix
        shell: powershell
        run: |
          dart pub global activate flutter_distributor
          # Make sure the pub global bin dir is on PATH, otherwise the build
          # step will not find flutter_distributor.
          $pubBin = Join-Path $env:LOCALAPPDATA 'Pub\Cache\bin'
          if (Test-Path -LiteralPath $pubBin) {
            $pubBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            Write-Host "Added to PATH: $pubBin"
          }

      - name: 打印环境信息
        shell: powershell
        run: |
          flutter --version
          flutter config --enable-windows-desktop
          Write-Host "--- Visual Studio C++ toolchain (required by dart_quickjs) ---"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path -LiteralPath $vswhere) {
            $vs = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
            if ($vs) { Write-Host "OK: $vs" } else { Write-Host "C++ toolchain NOT found" -ForegroundColor Yellow }
          } else {
            Write-Host "vswhere not found" -ForegroundColor Yellow
          }

      - name: 打包（下载上游源码 + 叠加改造 + 编译 + 压包）
        shell: powershell
        # 显式指定工作目录，不依赖 runner 的默认 CWD
        working-directory: ${{ github.workspace }}
        # Use Windows PowerShell 5.1 rather than pwsh: build_windows.ps1 was verified on 5.1.
        run: |
          $tag = "${{ inputs.upstream_tag || 'v1.11.4' }}"
          $script = Join-Path $env:GITHUB_WORKSPACE 'packaging\build_windows.ps1'
          if (-not (Test-Path -LiteralPath $script)) {
            Write-Host "Build script not found: $script" -ForegroundColor Red
            exit 1
          }

          # Use a HASHTABLE for splatting named parameters, not an array.
          # Array splatting (@('-WorkDir', $x, '-UseArchive', ...)) is designed for
          # positional arguments and is unreliable for named ones: with this exact
          # argument set it fails with
          #   "A positional parameter cannot be found that accepts argument 'https://...'"
          # Reproduced both locally and on the runner. The hashtable form binds by
          # name and works regardless of order.
          $scriptArgs = @{
            WorkDir    = "${{ runner.temp }}\dslbuild"
            UseArchive = $true
            Tag        = $tag
            ArchiveUrl = "https://codeload.github.com/lostars/dart_simple_live/zip/refs/tags/$tag"
          }
          if ('${{ inputs.build_msix }}' -eq 'true') { $scriptArgs['Msix'] = $true }

          Write-Host "Running: $script"
          Write-Host ("  args: " + (($scriptArgs.GetEnumerator() | ForEach-Object { "-$($_.Key) $($_.Value)" }) -join ' '))
          & $script @scriptArgs

          # The exit code must be checked explicitly, and `-ne 0` alone is not enough:
          #   * When `& script.ps1` hits an `exit N` inside the script, it only ends
          #     that script; the caller keeps running and the process exit code stays 0.
          #     Not checking at all means a failed build is reported as success.
          #   * When the script finishes normally, $LASTEXITCODE is $null, and
          #     $null -ne 0 is true. Checking only `-ne 0` means success is reported
          #     as failure.
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            Write-Host "Build script failed with exit code $LASTEXITCODE" -ForegroundColor Red
            exit $LASTEXITCODE
          }

      - name: 列出产物
        shell: powershell
        run: |
          $dist = "${{ runner.temp }}\dslbuild\dist"
          if (-not (Test-Path -LiteralPath $dist)) {
            Write-Host "Output dir not found: $dist" -ForegroundColor Red
            exit 1
          }
          Get-ChildItem -LiteralPath $dist -Recurse -File |
            Select-Object @{n='SizeMB';e={[math]::Round($_.Length/1MB,1)}}, Name, FullName |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-windows
          # 只传 zip，中间的未压缩目录没必要占空间
          path: ${{ runner.temp }}/dslbuild/dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release（仅在推 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem "${{ runner.temp }}\dslbuild\dist\*.zip" | Select-Object -First 1
          if (-not $zip) {
            Write-Host "No zip artifact found" -ForegroundColor Red
            exit 1
          }
          Write-Host "Releasing $($zip.Name)"
          # If a Release with the same tag already exists, upload the asset instead.
          gh release create "${{ github.ref_name }}" $zip.FullName `
            --title "${{ github.ref_name }}" --generate-notes
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release may already exist, uploading asset instead"
            gh release upload "${{ github.ref_name }}" $zip.FullName --clobber
          }
